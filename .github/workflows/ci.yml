name: CI

on:
  push:
    branches: [master, "claude/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Keep in sync with .devcontainer/Dockerfile (ARG JUST_VERSION).
  JUST_VERSION: 1.54.0

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show && rustup component add rustfmt clippy

      - name: Install Yosys + Verilator
        # Provides the conformance oracle's external tools. The devcontainer
        # uses oss-cad-suite; CI uses the distro packages for speed.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends yosys verilator
          yosys --version
          verilator --version

      - name: Install just
        # Same task runner as the devcontainer, so every step below is exactly
        # what a developer runs locally (`just <recipe>` / `just ci`).
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh \
            | bash -s -- --tag "${JUST_VERSION}" --to "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/just" --version

      # Each step drives a just recipe so CI and local runs stay in lockstep.
      # `just ci` runs all of these in one shot for local reproduction.
      - name: Format check
        run: just fmt

      - name: Clippy
        run: just clippy

      - name: Unit + integration tests
        run: just test

      - name: Conformance oracle (Yosys synth + Verilator trace-diff, enforced)
        # require=1 -> fail if Yosys/Verilator are missing.
        run: just conformance 1

      - name: Build release
        run: just build
