name: CI

on:
  push:
    branches: [master, "claude/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show && rustup component add rustfmt clippy

      - name: Install Yosys + Verilator
        # Provides the conformance oracle's external tools. The devcontainer
        # uses oss-cad-suite; CI uses the distro packages for speed.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends yosys verilator
          yosys --version
          verilator --version

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Unit + integration tests
        run: cargo test --workspace

      - name: Conformance oracle (Yosys synth + Verilator trace-diff, enforced)
        env:
          SINTER_REQUIRE_TOOLS: "1"
        run: cargo test -p sinter-compiler --test conformance -- --nocapture

      - name: Build release
        run: cargo build --release
