[package]
name = "sinter-lang"
description = "The Sinter HDL compiler CLI (installs the `sinter` binary)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
categories = ["compilers", "command-line-utilities", "simulation"]
readme = "README.md"
# Tests and fixtures read files elsewhere in the repository, so only the
# sources are packaged.
include = ["/src/**/*", "/README.md", "/LICENSE-*"]

[[bin]]
name = "sinter"
path = "src/main.rs"

[dependencies]
sinter-syntax = { workspace = true }
sinter-compiler = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
