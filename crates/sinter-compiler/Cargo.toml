[package]
name = "sinter-compiler"
description = "Semantic checks and backends (Verilog, Rust simulator) for Sinter."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
categories = ["compilers", "simulation"]
readme = "README.md"
# Tests and fixtures read files elsewhere in the repository, so only the
# sources are packaged.
include = ["/src/**/*", "/README.md", "/LICENSE-*"]

[dependencies]
sinter-syntax = { workspace = true }
thiserror = { workspace = true }
